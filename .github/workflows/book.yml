name: Book table

on:
  # Triggered by cron-job.org at 12:30 AM Toronto on Tue/Thu (reliable timing).
  # It sends a repository_dispatch of type "book-now", which books for real.
  repository_dispatch:
    types: [book-now]
  # Optional backup: GitHub's own scheduler (can be late or skipped; cron-job.org is primary).
  # Fires at two UTC times for EDT/EST; the run outside the window just exits.
  schedule:
    - cron: '25 4,5 * * 2,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test only: stop before actually reserving'
        type: boolean
        default: true
      target_date:
        description: 'Book a specific date instead (YYYY-MM-DD). Leave empty for 14 days from today.'
        required: false
        default: ''

concurrency: book-table

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Restore saved login session
        uses: actions/cache/restore@v4
        with:
          path: .auth
          key: okta-session-${{ github.run_id }}
          restore-keys: okta-session-

      - name: Book
        run: node book.js
        env:
          OKTA_USERNAME: ${{ secrets.OKTA_USERNAME }}
          OKTA_PASSWORD: ${{ secrets.OKTA_PASSWORD }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          RESERVATION_URL: ${{ vars.RESERVATION_URL }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
          DAYS_AHEAD: ${{ vars.DAYS_AHEAD }}
          BOOK_DAYS: ${{ vars.BOOK_DAYS }}
          BOOK_AT: ${{ vars.BOOK_AT || '00:15' }}
          DATE_FORMAT: ${{ vars.DATE_FORMAT }}
          FORM_FIELDS: ${{ vars.FORM_FIELDS }}
          PREFERRED_SPACES: ${{ vars.PREFERRED_SPACES }}
          ONLY_PREFERRED: ${{ vars.ONLY_PREFERRED }}
          SUCCESS_TEXT: ${{ vars.SUCCESS_TEXT }}
          CHATURL: ${{ secrets.CHATURL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN }}
          TARGET_DATE: ${{ inputs.target_date }}
          # repository_dispatch (cron-job.org) and workflow_dispatch both book immediately,
          # skipping the BOOK_AT wait. A repository_dispatch always books for real.
          FORCE: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' }}

      - name: Save login session for next run
        if: always() && hashFiles('.auth/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .auth
          key: okta-session-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: output/
          retention-days: 14
